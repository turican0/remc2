name: Linux ARM64 CI
on:
  push:
    branches:
      [ master, development ]
  pull_request:
      types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  GITHUB_CI_COMPATIBILITY_PATH: /usr/lib/aarch64-linux-gnu

jobs:
  build:
    # Native ARM64 runner - no cross-compilation, no multi-arch apt.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Debug, Release]

    steps:
    - name: Check Out Sources
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: src

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends \
          build-essential \
          cmake ninja-build \
          libsdl2-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libsdl2-image-dev \
          libgtest-dev \
          libspdlog-dev libfmt-dev \
          libpng-dev \
          nlohmann-json3-dev \
          libwxgtk3.2-dev

    - name: Generate Build System - ${{matrix.BUILD_CONFIGURATION}}
      run: |
        cd ${{ github.workspace }}
        mkdir build_${{matrix.BUILD_CONFIGURATION}}
        cd build_${{matrix.BUILD_CONFIGURATION}}
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE=${{matrix.BUILD_CONFIGURATION}} \
          -DUSE_64_BIT=True \
          -DUNIT_TESTS=True \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DGITHUB_CI_COMPATIBILITY_PATH="${{env.GITHUB_CI_COMPATIBILITY_PATH}}" \
          ${{ github.workspace }}/src

    - name: Build - ${{matrix.BUILD_CONFIGURATION}}
      run: |
        cd ${{ github.workspace }}/build_${{matrix.BUILD_CONFIGURATION}}
        ninja

    - name: Run Unit Tests
      run: |
        cd ${{ github.workspace }}/build_${{matrix.BUILD_CONFIGURATION}}/remc2-unit-test
        ./remc2-unit-test
