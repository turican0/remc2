name: Personalize Main Page (Sandwich)

on:
  push:
    branches: ["**"]
    paths:
      - '.github/readme-template/**'
      - 'README.md'
      - '.github/workflows/personalized-readme.yml'
  pull_request:
    paths:
      - '.github/readme-template/**'
      - 'README.md'
      - '.github/workflows/personalized-readme.yml'
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'turican0/remc2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Assemble README
        run: |
          TEMPLATE_DIR=".github/readme-template"
          HEAD="$TEMPLATE_DIR/turican0-head.md"
          TAIL="$TEMPLATE_DIR/turican0-tail.md"
          
          if [ ! -f "$HEAD" ] || [ ! -f "$TAIL" ]; then
            echo "Error: Missing templates."
            exit 1
          fi

          sed -n '//,//p' README.md > CONTENT.tmp

          if [ ! -s CONTENT.tmp ]; then
            cat README.md > CONTENT.tmp
          fi

          cat "$HEAD" > NEW_README.md
          echo -e "\n" >> NEW_README.md
          cat CONTENT.tmp >> NEW_README.md
          echo -e "\n" >> NEW_README.md
          cat "$TAIL" >> NEW_README.md

          mv NEW_README.md README.md
          rm CONTENT.tmp

      - name: Commit and Push changes
        run: |
          TARGET_BRANCH=${{ github.event.pull_request.head.ref || github.ref_name }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: personalize readme (turican0-style)" || exit 0
          git push origin $TARGET_BRANCH